name: AI Data Quality Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"   # codziennie 07:00

jobs:
  run-guardian:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # LOAD SECRETS + AUTO-TRIM
      # -----------------------------
      - name: Load secrets (trimmed)
        run: |
          # Trim secrets to avoid \r or \n errors from browser copy/paste
          export JIRA_URL="$(echo "${{ secrets.JIRA_URL }}" | tr -d '\r' | tr -d '\n' | xargs)"
          export JIRA_EMAIL="$(echo "${{ secrets.JIRA_EMAIL }}" | tr -d '\r' | tr -d '\n' | xargs)"
          export JIRA_API_TOKEN="$(echo "${{ secrets.JIRA_API_TOKEN }}" | tr -d '\r' | tr -d '\n' | xargs)"
          export JIRA_SPACE_KEY="$(echo "${{ secrets.JIRA_SPACE_KEY }}" | tr -d '\r' | tr -d '\n' | xargs)"

          export OPENAI_API_KEY="$(echo "${{ secrets.OPENAI_API_KEY }}" | tr -d '\r' | tr -d '\n' | xargs)"
          export SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}"
          export EMAIL_TO="${{ secrets.EMAIL_TO }}"
          export EMAIL_FROM="${{ secrets.EMAIL_FROM }}"
          export SMTP_HOST="${{ secrets.SMTP_HOST }}"
          export SMTP_PORT="${{ secrets.SMTP_PORT }}"
          export SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}"
          export SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          export TABLEAU_CLOUD_URL="${{ secrets.TABLEAU_CLOUD_URL }}"
          export TABLEAU_SITE_ID="${{ secrets.TABLEAU_SITE_ID }}"
          export TABLEAU_TOKEN_NAME="${{ secrets.TABLEAU_TOKEN_NAME }}"
          export TABLEAU_TOKEN_SECRET="${{ secrets.TABLEAU_TOKEN_SECRET }}"

          # Export to GITHUB_ENV so next steps see the variables
          {
            echo "JIRA_URL=$JIRA_URL"
            echo "JIRA_EMAIL=$JIRA_EMAIL"
            echo "JIRA_API_TOKEN=$JIRA_API_TOKEN"
            echo "JIRA_SPACE_KEY=$JIRA_SPACE_KEY"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
          } >> $GITHUB_ENV

      # -----------------------------
      # SECRET DEBUGGING
      # -----------------------------
      - name: Debug secrets
        run: |
          echo "JIRA_URL length: ${#JIRA_URL}"
          echo "JIRA_EMAIL length: ${#JIRA_EMAIL}"
          echo "JIRA_API_TOKEN length: ${#JIRA_API_TOKEN}"
          echo "JIRA_SPACE_KEY = $JIRA_SPACE_KEY"
          echo "OpenAI key length: ${#OPENAI_API_KEY}"

      # -----------------------------
      # RUN MAIN APP
      # -----------------------------
      - name: Run Guardian
        run: |
          python -m src.main
