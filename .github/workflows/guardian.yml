name: AI Data Quality Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔥 NIE RUSZAMY SECRETS – TYLKO WYPISUJEMY ICH DŁUGOŚĆ
      - name: Debug secrets
        run: |
          echo "SLACK_WEBHOOK_URL length: ${#SLACK_WEBHOOK_URL}"
          echo "SMTP_HOST length: ${#SMTP_HOST}"
          echo "SMTP_USERNAME length: ${#SMTP_USERNAME}"
          echo "SMTP_PASSWORD length: ${#SMTP_PASSWORD}"
          echo "SMTP_PORT length: ${#SMTP_PORT}"
          echo "EMAIL_FROM length: ${#EMAIL_FROM}"
          echo "EMAIL_TO length: ${#EMAIL_TO}"

          echo "JIRA_URL length: ${#JIRA_URL}"
          echo "JIRA_EMAIL length: ${#JIRA_EMAIL}"
          echo "JIRA_API_TOKEN length: ${#JIRA_API_TOKEN}"
          echo "JIRA_PROJECT_KEY length: ${#JIRA_PROJECT_KEY}"
          echo "JIRA_SPACE_KEY length: ${#JIRA_SPACE_KEY}"

          echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"

      - name: Run Guardian
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SPACE_KEY: ${{ secrets.JIRA_SPACE_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.main
