name: AI Data Quality Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

jobs:
  run-guardian:
    runs-on: ubuntu-latest

    steps:
      # 1) Repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 3) Dependencies
      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # 4) 🔍 DEBUG — Pokaż wartości zmiennych JIRA (bez wycieku)
      - name: Debug JIRA env
        run: |
          echo "JIRA_URL length: ${#JIRA_URL}"
          echo "JIRA_EMAIL length: ${#JIRA_EMAIL}"
          echo "JIRA_API_TOKEN length: ${#JIRA_API_TOKEN}"
          echo "JIRA_PROJECT_KEY = ${JIRA_PROJECT_KEY}"

      # 5) 🔍 DEBUG — OpenAI
      - name: Debug OpenAI key
        run: |
          echo "OpenAI KEY LENGTH = ${#OPENAI_API_KEY}"

      # 6) 🧪 Test OpenAI API
      - name: Test OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 << 'EOF'
          from openai import OpenAI
          client = OpenAI()
          models = client.models.list()
          print("=== OpenAI Model List OK ===")
          print(models)
          EOF

      # 7) 🚀 Run Guardian
      - name: Run python -m src.main
        env:
          # OPENAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # SLACK
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # SMTP
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # JIRA (tylko 4 zmienne!)
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

          # TABLEAU
          TABLEAU_CLOUD_URL: ${{ secrets.TABLEAU_CLOUD_URL }}
          TABLEAU_SITE_ID: ${{ secrets.TABLEAU_SITE_ID }}
          TABLEAU_TOKEN_NAME: ${{ secrets.TABLEAU_TOKEN_NAME }}
          TABLEAU_TOKEN_SECRET: ${{ secrets.TABLEAU_TOKEN_SECRET }}

        run: python -m src.main
