name: AI Data Quality Guardian

on:
 # workflow_dispatch:
 # schedule:
    #- cron: "0 */6 * * *"

jobs:
  run-guardian:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai jira

      # -----------------------------
      # LOAD & TRIM SECRETS
      # -----------------------------
      - name: Load secrets (trim + export)
        run: |
          # === TRIM SECRETS ===
          trim() { echo "$1" | tr -d '\r' | tr -d '\n' | xargs; }

          echo "JIRA_URL=$(trim "${{ secrets.JIRA_URL }}")" >> $GITHUB_ENV
          echo "JIRA_EMAIL=$(trim "${{ secrets.JIRA_EMAIL }}")" >> $GITHUB_ENV
          echo "JIRA_API_TOKEN=$(trim "${{ secrets.JIRA_API_TOKEN }}")" >> $GITHUB_ENV
          echo "JIRA_SPACE_KEY=$(trim "${{ secrets.JIRA_SPACE_KEY }}")" >> $GITHUB_ENV

          echo "OPENAI_API_KEY=$(trim "${{ secrets.OPENAI_API_KEY }}")" >> $GITHUB_ENV

          echo "SLACK_WEBHOOK_URL=$(trim "${{ secrets.SLACK_WEBHOOK_URL }}")" >> $GITHUB_ENV
          echo "EMAIL_FROM=$(trim "${{ secrets.EMAIL_FROM }}")" >> $GITHUB_ENV
          echo "EMAIL_TO=$(trim "${{ secrets.EMAIL_TO }}")" >> $GITHUB_ENV
          echo "SMTP_HOST=$(trim "${{ secrets.SMTP_HOST }}")" >> $GITHUB_ENV
          echo "SMTP_PORT=$(trim "${{ secrets.SMTP_PORT }}")" >> $GITHUB_ENV
          echo "SMTP_USERNAME=$(trim "${{ secrets.SMTP_USERNAME }}")" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=$(trim "${{ secrets.SMTP_PASSWORD }}")" >> $GITHUB_ENV

          echo "TABLEAU_CLOUD_URL=$(trim "${{ secrets.TABLEAU_CLOUD_URL }}")" >> $GITHUB_ENV
          echo "TABLEAU_SITE_ID=$(trim "${{ secrets.TABLEAU_SITE_ID }}")" >> $GITHUB_ENV
          echo "TABLEAU_TOKEN_NAME=$(trim "${{ secrets.TABLEAU_TOKEN_NAME }}")" >> $GITHUB_ENV
          echo "TABLEAU_TOKEN_SECRET=$(trim "${{ secrets.TABLEAU_TOKEN_SECRET }}")" >> $GITHUB_ENV

      # -----------------------------
      # DEBUG
      # -----------------------------
      - name: Debug secrets
        run: |
          echo "JIRA_URL length = ${#JIRA_URL}"
          echo "JIRA_EMAIL length = ${#JIRA_EMAIL}"
          echo "JIRA_API_TOKEN length = ${#JIRA_API_TOKEN}"
          echo "JIRA_SPACE_KEY = $JIRA_SPACE_KEY"
          echo "OPENAI_API_KEY length = ${#OPENAI_API_KEY}"
          echo "SLACK_WEBHOOK_URL length = ${#SLACK_WEBHOOK_URL}"
          echo "SMTP_HOST length = ${#SMTP_HOST}"

      # -----------------------------
      # RUN APP
      # -----------------------------
      - name: Run Guardian
        run: python -m src.main
